[workspace]
resolver = "2"
members = ["crates/nitro-hal", "crates/nitro-discover", "crates/nitro-cli", "crates/nitrod", "crates/nitro-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-3.0-or-later"

[workspace.dependencies]
nitro-hal = { path = "crates/nitro-hal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
